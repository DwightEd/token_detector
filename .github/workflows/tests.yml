name: Tests

on: [push, pull_request]

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[experiments,dev]'
      - name: Test installed packages outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          r4-detect --help
          r4-experiment --help
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
