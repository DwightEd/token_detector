[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r4-token-detector"
version = "0.1.0"
description = "Token-level source risk with shared-state inference and individual evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "torch==2.8.0",
    "transformers==4.57.1",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
experiments = ["scikit-learn==1.9.0"]
nli = ["accelerate==1.10.1"]
research = []
probe = ["accelerate==1.10.1", "bitsandbytes==0.48.0"]
paper = ["matplotlib==3.11.1"]
docs = ["Markdown==3.11.2", "scikit-learn==1.9.0"]
syntax = ["ufal.udpipe==1.3.1.1"]
dev = ["pytest==9.1.1"]

[project.scripts]
token-detect = "myproject.run:main"
token-experiment = "experiments.run:main"
r4-detect = "experiments.detect:main"
r4-experiment = "experiments.run:main"
r4-research = "experiments.research.run:main"

[project.urls]
Repository = "https://github.com/DwightEd/token_detector"

[tool.setuptools]
packages = ["myproject", "experiments", "experiments.research"]
package-dir = {"" = "."}
include-package-data = false

[tool.setuptools.package-data]
"experiments.research" = ["references/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
